# database.rules.json を GitHub に上げると、自動で Firebase に反映する
name: Firebaseのルールを反映
on:
  push:
    branches: [main]
    paths:
      - 'database.rules.json'
      - 'firebase.json'
      - '.github/workflows/firebase-rules.yml'
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 鍵を一時ファイルに書く
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SA" ]; then echo "FIREBASE_SERVICE_ACCOUNT が登録されていません"; exit 1; fi
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
      - name: ルールを反映
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
        run: npx -y firebase-tools@latest deploy --only database --project furoya-no-onna --non-interactive
      - name: 鍵を消す
        if: always()
        run: rm -f "$RUNNER_TEMP/sa.json"
