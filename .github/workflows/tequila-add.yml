# ドパがき：送れなかった本物の記録を手で入れる（tequila-add.json を上げると動く）
name: ドパがき 記録を手で入れる
on:
  push:
    branches: [main]
    paths:
      - 'tequila-add.json'
      - '.github/workflows/tequila-add.yml'
  workflow_dispatch:
jobs:
  add:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 鍵を一時ファイルに書く
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
      - name: 入れる
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
        run: |
          node -e 'const d=require("./tequila-add.json");for(const [k,v] of Object.entries(d)){if(!/^[A-Za-z0-9]{8,40}$/.test(k))throw k;require("fs").writeFileSync(process.env.RUNNER_TEMP+"/"+k+".json",JSON.stringify(v));console.log(k)}' > "$RUNNER_TEMP/keys.txt"
          while read -r k; do
            npx -y firebase-tools@latest database:set "/tequila/scores/$k" "$RUNNER_TEMP/$k.json" --project furoya-no-onna --force --non-interactive
          done < "$RUNNER_TEMP/keys.txt"
      - name: 鍵を消す
        if: always()
        run: rm -f "$RUNNER_TEMP/sa.json"
