# ドパがきにはできないゲーム：送れなかった記録を手で入れる
# tequila-add.json に { "キー": { "n": 名前, "c": 回数, "s": 秒, "t": 時刻 } } を書いて GitHub に上げると自動で入る
# 入れたあと、ランキングの中身を tequila-add-result.json に書き出す（入ったかの確認用）
name: ドパがき ランキングに手で記録を入れる
on:
  push:
    branches: [main]
    paths:
      - 'tequila-add.json'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  add:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 鍵を一時ファイルに書く
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
      - name: 記録を入れる
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
        run: |
          node -e '
            const d=JSON.parse(require("fs").readFileSync("tequila-add.json","utf8"));
            for(const [k,v] of Object.entries(d)){
              if(!/^[A-Za-z0-9_]{3,40}$/.test(k)) throw new Error("キーの形がちがう "+k);
              if(typeof v.n!=="string"||!v.n.length||v.n.length>12) throw new Error("名前 "+k);
              if(!(v.c>=1&&v.s>=1&&v.c<=v.s/44+3)) throw new Error("回数と秒が合わない "+k);
            }'
          npx -y firebase-tools@latest database:update /tequila/scores tequila-add.json --project furoya-no-onna --force --non-interactive
          npx -y firebase-tools@latest database:get /tequila/scores --project furoya-no-onna --order-by '"c"' --limit-to-last 5 -o tequila-add-result.json
      - name: 鍵を消す
        if: always()
        run: rm -f "$RUNNER_TEMP/sa.json"
      - name: 確認用のファイルを上げる
        run: |
          git config user.name "add-bot"
          git config user.email "add-bot@users.noreply.github.com"
          git add tequila-add-result.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "手で入れた記録の確認"
          git pull --rebase --autostash || true
          git push
