# ドパがき：途中経過（runs）の様子を見る（調査用・データは変えない）
name: ドパがき 途中経過を見る
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tequila-inspect.yml'
  workflow_dispatch:
jobs:
  look:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 鍵を一時ファイルに書く
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
      - name: 見る
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
        run: |
          npx -y firebase-tools@latest database:get /tequila/runs --project furoya-no-onna -o "$RUNNER_TEMP/runs.json"
          npx -y firebase-tools@latest database:get /tequila/scores --project furoya-no-onna -o "$RUNNER_TEMP/scores.json"
          node -e '
            const fs=require("fs"),T=process.env.RUNNER_TEMP;
            const runs=JSON.parse(fs.readFileSync(T+"/runs.json","utf8"))||{};
            const sc=JSON.parse(fs.readFileSync(T+"/scores.json","utf8"))||{};
            const j=t=>new Date(t+9*3600e3).toISOString().slice(5,19).replace("T"," ");
            const rows=Object.entries(runs);
            console.log("途中経過",rows.length,"件");
            const show=([k,v])=>console.log("候補",k.slice(0,8),"回数",v.c,"申告秒",v.s,"実時間",Math.round((v.hb-v.st)/1000),"開始",j(v.st),"最後の通信",j(v.hb),"ランキング",sc[k]?(sc[k].n+" "+sc[k].c+"回 "+sc[k].s+"秒"):"なし");
            // さしすばさん：973回・43034秒（11:57:14）・11/3 8時ごろ終了
            rows.filter(([k,v])=>(v.c>=850&&v.c<=1000)||(v.s>=38000&&v.s<=44000)).forEach(show);
            const ng1=rows.filter(([k,v])=>v.s>(v.hb-v.st)/1000+3).length;
            const ng2=rows.filter(([k,v])=>v.c>v.s/44+3).length;
            console.log("集計 申告秒が実時間を超えた:",ng1,"回数が多すぎ:",ng2);
            for(const [k,v] of Object.entries(sc))if(v.n&&String(v.n).includes("さしすば"))console.log("ランキングに",k.slice(0,8),v.n,v.c,v.s);
          '
      - name: 鍵を消す
        if: always()
        run: rm -f "$RUNNER_TEMP/sa.json"
