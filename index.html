const FPS=60;
const P_UP=0.46/FPS, P_DOWN=0.6/FPS, P_MAX=1.15;
const SHAPE_KEYS=['box','ball','cone'];
const SHAPE_CAT={box:'h',ball:'m',cone:'f'};
function makeItem(g,n,prev){
  const r=g.rng;
  // 形（同じ形が続きすぎないように）
  const w=SHAPE_KEYS.map(k=>prev&&prev.id===k?0.55:1);const tw=w[0]+w[1]+w[2];
  let v=r()*tw,id='box';for(let i=0;i<3;i++){v-=w[i];if(v<=0){id=SHAPE_KEYS[i];break}}
  const cat=SHAPE_CAT[id];
  // 大きさ（進むほど大きいのが出る。まれに特大）
  const r1=r(),r2=r(),r3=r();
  let size=Math.round(25+Math.pow(r1,1.6)*(55+Math.min(220,n*11)));
  if(n>=12&&r2<0.05)size=Math.round(400+r3*500);
  const base=cat==='h'?0.74+r()*0.17:cat==='m'?0.48+r()*0.15:0.22+r()*0.13;
  let W=Math.max(0.05,0.23-n*0.006);if(cat==='f')W*=0.9;
  const need=Math.min(6.2,0.95+size/95)*FPS;
  // たまに出る変なもの：金の○（大きさ2倍あつかい）、ゆらゆら形が変わるもの（見た目だけ）
  const rg=r(),rw=r();
  const gold=id==='ball'&&n>=3&&rg<0.12;
  const wobbly=!gold&&n>=2&&rw<0.08;
  if(gold)size*=2;
  const it={id,cat,size,gold,wobbly,T:base,T0:base,W,need,prog:0,snag:null,dm:0.42+Math.min(0.5,n*0.02),
    drift:n>=12?Math.min(0.13,(n-12)*0.0065):0,dper:Math.round((2+r()*1.4)*FPS),dph:Math.floor(r()*240)};
  if(n>=4&&r()<Math.min(0.55,0.12+n*0.022)){
    const at=need*(0.3+r()*0.4);
    const kind=cat==='h'?'loose':cat==='f'?'stuck':(r()<0.5?'stuck':'loose');
    const T2=kind==='loose'?Math.max(0.18,base-0.28-r()*0.12):Math.min(0.97,base+0.24+r()*0.1);
    it.snag={at,kind,T2,done:false};
  }

}
function newGame(seed){
  const g={seed,rng:mulberry32(seed),f:0,hold:false,P:0,score:0,n:0,stress:0,slip:0,
    phase:'pull',grace:Math.round(2.2*FPS),popF:0,dead:null,item:null,big:null,rec:[],replay:null,ev:[],cnt:{box:0,ball:0,cone:0},hist:[]};
  g.item=makeItem(g,0,null);g.next=makeItem(g,1,g.item);return g;
}
function setHold(g,h){if(g.dead||g.replay)return;if(g.hold===h)return;g.hold=h;g.rec.push([g.f,h?1:0])}
function simStep(g){
  if(g.replay){const ev=g.replay.ev;while(g.replay.i<ev.length&&ev[g.replay.i][0]<=g.f){g.hold=ev[g.replay.i][1]===1;g.replay.i++}}
  g.f++;
  if(g.dead)return;
  g.P=clamp(g.P+(g.hold?P_UP:-P_DOWN),0,P_MAX);
  if(g.phase==='pop'){
    g.popF--;g.stress=Math.max(0,g.stress-1.6/FPS);g.slip=Math.max(0,g.slip-1.6/FPS);
    if(g.popF<=0){g.item=g.next;g.next=makeItem(g,g.n+1,g.item);g.phase='pull';g.grace=Math.round(1.4*FPS);g.ev.push({k:'next'})}
    return;
  }
  const it=g.item;
  if(it.snag&&!it.snag.done&&it.prog>=it.snag.at){it.snag.done=true;it.T0=it.snag.T2;g.grace=Math.max(g.grace,Math.round(0.8*FPS));g.ev.push({k:it.snag.kind})}
  if(it.drift>0){const ph=((g.f+it.dph)%it.dper)/it.dper;const tri=ph<0.5?ph*4-1:3-ph*4;it.T=clamp(it.T0+it.drift*tri,0.15,1.05)}else it.T=it.T0;
  const lo=it.T-it.W,hi=it.T+it.W,P=g.P;
  g.hist.push(P,lo,hi);if(g.hist.length>900)g.hist.splice(0,g.hist.length-900);
  if(P>=lo&&P<=hi){
    it.prog+=1-0.45*Math.abs(P-it.T)/it.W;
    g.stress=Math.max(0,g.stress-1.5/FPS);g.slip=Math.max(0,g.slip-1.5/FPS);
  }else if(g.grace>0||g.n===0){
    // 猶予中・最初の1個（練習）は失敗しない
    g.stress=Math.max(0,g.stress-0.8/FPS);g.slip=Math.max(0,g.slip-0.8/FPS);
  }else if(P>hi){

  }else{
    g.slip+=it.dm*(0.85+(lo-P)*6)/FPS;g.stress=Math.max(0,g.stress-1.2/FPS);
  }
  if(g.grace>0)g.grace--;
  if(g.stress>=1){g.dead='snap';g.endF=g.f;g.ev.push({k:'snap'});return}
  if(g.slip>=1){g.dead='slip';g.endF=g.f;g.ev.push({k:'slip'});return}

    g.score+=it.size;g.n++;g.cnt[it.id]++;

    g.phase='pop';g.popF=Math.round(0.6*FPS);g.ev.push({k:'pop',it});
  }
}

function decRec(s){const ev=[];let f=0;if(!s)return ev;for(const t of s.split('.')){f+=parseInt(t.slice(0,-1)||'0',36);ev.push([f,+t.slice(-1)])}return ev}

function tone(freq,dur,type,vol,dest,slide,at){if(!AC||(DEMO_MUTE&&dest!==BGM_G))return;const t=at||AC.currentTime;const o=AC.createOscillator(),g=AC.createGain();o.type=type||'sine';o.frequency.setValueAtTime(freq,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(20,slide),t+dur);

const SE={
  pop(size){const k=clamp(size/200,0.2,1.6);noise(0.18,900,180,0.5,2);tone(320-k*80,0.2,'sine',0.5,null,90);

function woodTex(w,h,dir,base,line,count){
  const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');
  x.fillStyle=base;x.fillRect(0,0,w,h);
  const rnd=mulberry32(count*7+w);
  for(let i=0;i<count;i++){
    const p=i/count;
    x.fillStyle=`rgba(${rnd()<0.5?'255,220,170':'60,30,10'},${0.04+rnd()*0.08})`;
    if(dir==='v'){x.fillRect(p*w,0,w/count,h)}else{x.fillRect(0,p*h,w,h/count)}
    x.strokeStyle=line;x.lineWidth=2;x.beginPath();if(dir==='v'){x.moveTo(p*w,0);x.lineTo(p*w,h)}else{x.moveTo(0,p*h);x.lineTo(w,p*h)}x.stroke();
    // 木目
    x.strokeStyle='rgba(60,28,8,.12)';x.lineWidth=1;
    for(let k=0;k<5;k++){x.beginPath();const o=rnd();if(dir==='v'){const xx=(p+o/count)*w;x.moveTo(xx,0);x.bezierCurveTo(xx+6,h*0.3,xx-6,h*0.6,xx+2,h)}else{const yy=(p+o/count)*h;x.moveTo(0,yy);x.bezierCurveTo(w*0.3,yy+5,w*0.6,yy-5,w,yy+2)}x.stroke()}
  }
  const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.encoding=THREE.sRGBEncoding;t.anisotropy=4;return t;
}

function sludgeMat(){
  return new THREE.MeshPhysicalMaterial({vertexColors:true,roughness:0.32,metalness:0,clearcoat:1,clearcoatRoughness:0.12});
}
function colorize(geo,seed){
  const pos=geo.attributes.position,col=new Float32Array(pos.count*3),r=mulberry32(seed);
  const c1=new THREE.Color(0x5c3a16),c2=new THREE.Color(0x3b2a10),c3=new THREE.Color(0x4a5420),tmp=new THREE.Color();
  const ph=[r()*6,r()*6,r()*6];
  for(let i=0;i<pos.count;i++){const x=pos.getX(i),y=pos.getY(i),z=pos.getZ(i);
    const n=Math.sin(x*3.1+ph[0])*Math.sin(y*2.7+ph[1])*Math.sin(z*3.3+ph[2]);
    tmp.copy(c1).lerp(c2,clamp(0.5+n*0.8,0,1));if(n>0.45)tmp.lerp(c3,(n-0.45)*1.6);
    col[i*3]=tmp.r;col[i*3+1]=tmp.g;col[i*3+2]=tmp.b}
  geo.setAttribute('color',new THREE.BufferAttribute(col,3));
}
function lumpy(geo,amp,seed){const pos=geo.attributes.position,r=mulberry32(seed),ph=[r()*6,r()*6,r()*6];
  for(let i=0;i<pos.count;i++){const x=pos.getX(i),y=pos.getY(i),z=pos.getZ(i);const k=1+amp*(Math.sin(x*4+ph[0])*Math.sin(y*3.5+ph[1])+Math.sin(z*4.5+ph[2])*0.5);pos.setXYZ(i,x*k,y*k,z*k)}
  geo.computeVertexNormals()}

  W3.cheekU=cheek(0.8,3);W3.cheekL=cheek(-0.8,7);g.add(W3.cheekU);g.add(W3.cheekL);
  // おしりの割れ目（暗いくぼみ）

  // たれるヘドロ
  W3.drips=[];
  for(const [x,y,z,s] of [[-0.6,-1.85,0.3,1],[0.4,-1.9,0.6,0.8],[1.2,-1.75,0.2,1.2],[-1.1,0.05,0.75,0.6],[0.3,1.85,0.7,0.7]]){

  g.position.set(3.0,2.12,-0.75);

  // くさい煙
  W3.stink=[];
  for(let i=0;i<10;i++){const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:W3.soft,color:0x9ccc50,transparent:true,opacity:0,depthWrite:false}));sp.userData.t=Math.random()*3;SCN.add(sp);W3.stink.push(sp)}
  // 穴（暗い円）とふちの輪とヘドロのさや
  W3.hole=new THREE.Mesh(new THREE.CircleGeometry(1,32),new THREE.MeshBasicMaterial({color:0x0b0602}));SCN.add(W3.hole);
  const ringG=new THREE.TorusGeometry(1,0.22,16,40);colorize(ringG,5);

  // さやの表面をぼこぼこに
  {const p=shG.attributes.position;for(let i=0;i<p.count;i++){const x=p.getX(i),y=p.getY(i),z=p.getZ(i);const a=Math.atan2(z,x);const k=1+0.12*Math.sin(a*5+y*9)+(1-y)*0.25;p.setXYZ(i,x*k,y,z*k)}shG.computeVertexNormals();colorize(shG,9)}

const SHAPE_COLOR={box:0x3f8fe0,ball:0xf2c230,cone:0xe8507a};
const POO=new THREE.Color(0x5a3812);
function shapeR(size){return clamp(0.16+size/260,0.18,1.35)}
function makeShape(id,size,clipped,gold){
  const r=shapeR(gold?size/2:size);let geo;
  if(id==='box'){geo=new THREE.BoxGeometry(r*1.7,r*1.7,r*1.7,2,2,2)}
  else if(id==='ball'){geo=new THREE.SphereGeometry(r,32,20)}
  else{geo=new THREE.ConeGeometry(r*0.95,r*2.2,40,1);}
  const mat=gold?new THREE.MeshPhysicalMaterial({color:new THREE.Color(0xffc93c),metalness:1,roughness:0.18,clearcoat:1,emissive:new THREE.Color(0x5a3a00),emissiveIntensity:0.6,clippingPlanes:clipped?[W3.clip]:[]})
    :new THREE.MeshPhysicalMaterial({color:new THREE.Color(SHAPE_COLOR[id]),roughness:0.25,clearcoat:0.8,clearcoatRoughness:0.2,clippingPlanes:clipped?[W3.clip]:[]});
  const m=new THREE.Mesh(geo,mat);m.userData={id,r,len:id==='cone'?r*2.2:r*1.7*(id==='box'?1:0)+(id==='ball'?r*2:0)};
  if(id==='box')m.userData.len=r*1.7;
  m.userData.gold=!!gold;
  return m;
}
function setDirty(m,k){m.material.color.set(m.userData.gold?0xffc93c:SHAPE_COLOR[m.userData.id]).lerp(POO,m.userData.gold?k*0.5:k)}

// 出てくる向きにそろえる（k：穴でしぼられる太さの割合）
function orientShape(m,dir,k,t){
  const id=m.userData.id,along=1/Math.pow(k,0.4);
  if(id==='box'){m.quaternion.setFromUnitVectors(V3(1,0,0),dir.clone().negate());m.scale.set(along,k,k)}
  else{m.quaternion.setFromUnitVectors(_up,dir);m.scale.set(k,along,k);if(id==='ball')m.rotateY(t*0.6)}
  if(m.userData.wobbly){const w=Math.sin(t*7)*0.22,w2=Math.sin(t*5.3+1)*0.22;m.scale.x*=1+w;m.scale.y*=1-w*0.6+w2*0.3;m.scale.z*=1+w2}
}
// ---------- デッサン人形 ----------
const MANNE={};
function buildMannequin(){
  const mat=new THREE.MeshStandardMaterial({color:0xd3d7de,roughness:0.32,metalness:0.05});MANNE.mat=mat;
  const sph=new THREE.SphereGeometry(1,20,14),cyl=new THREE.CylinderGeometry(1,1,1,16,1);
  const S=n=>{const m=new THREE.Mesh(sph,mat);SCN.add(m);return m};
  const C=n=>{const m=new THREE.Mesh(cyl,mat);SCN.add(m);return m};
  MANNE.j={};for(const k of ['hip','chest','neck','fK','bK','fF','bF','shF','shB','hands','elF','elB'])MANNE.j[k]=S();
  MANNE.l={};for(const k of ['torso1','torso2','neckL','fT','fS','bT','bS'])MANNE.l[k]=C();
  MANNE.armF=[],MANNE.armB=[];for(let i=0;i<10;i++){MANNE.armF.push(C());MANNE.armB.push(C())}
  const hg=new THREE.SphereGeometry(1,28,20);MANNE.head=new THREE.Mesh(hg,mat);SCN.add(MANNE.head);
  // 床の影
  MANNE.shadow=new THREE.Mesh(new THREE.CircleGeometry(1,24),new THREE.MeshBasicMaterial({color:0x000000,transparent:true,opacity:0.35,depthWrite:false}));MANNE.shadow.rotation.x=-Math.PI/2;SCN.add(MANNE.shadow);
}
const _up=V3(0,1,0),_v=V3(0,0,0);
function placeCyl(m,a,b,r){_v.subVectors(b,a);const L=_v.length();m.position.copy(a).addScaledVector(_v,0.5);m.scale.set(r,Math.max(0.001,L),r);if(L>1e-5)m.quaternion.setFromUnitVectors(_up,_v.normalize())}
function placeSph(m,p,r){m.position.copy(p);m.scale.set(r,r,r)}
// 2Dの骨組み（x-y）を作って、奥行きをつける
function mannePose(P,over,under,target,t,dead,dT){
  const lean=clamp(P/0.9,0,1.2),lvl=P<0.42?1:P<0.76?2:3;
  const shake=lvl===3&&!dead?Math.sin(t*70)*0.02:0;
  const tilt=0.08+lean*0.5,x0=FEET_X;
  const J={};const p=(x,y,z)=>V3(x,y,z==null?FEET_Z:z);
  J.fF=p(x0+0.42,0.08,FEET_Z+0.12);J.bF=p(x0-0.26,0.08,FEET_Z-0.12);
  J.hip=p(x0-lean*0.2+shake,0.86-lean*0.14);
  J.neck=p(J.hip.x-Math.sin(tilt)*0.76,J.hip.y+Math.cos(tilt)*0.76);
  J.head=p(J.neck.x-Math.sin(tilt)*0.27,J.neck.y+Math.cos(tilt)*0.27);J.tilt=tilt;
  J.chest=J.hip.clone().lerp(J.neck,0.55);
  const sh=J.hip.clone().lerp(J.neck,0.86);
  J.shF=sh.clone().add(V3(0,0,0.13));J.shB=sh.clone().add(V3(0,0,-0.13));
  const dir=target.clone().sub(sh).normalize();
  const arm=(0.6+lean*0.07)*(1+over*1.35);
  J.hands=sh.clone().addScaledVector(dir,arm);J.armDir=dir;J.arm=arm;
  const mf=J.hip.clone().lerp(J.fF,0.5),mb=J.hip.clone().lerp(J.bF,0.5);
  J.fK=mf.add(V3(0.1+lean*0.1,0.07+lean*0.05,0));J.bK=mb.add(V3(-0.06,0.04,0));
  const keys=['fF','bF','hip','neck','head','chest','shF','shB','hands','fK','bK'];
  if(dead==='snap'){const k=dT,c=J.hip.clone(),a=k*15,ca=Math.cos(a),sa=Math.sin(a),off=V3(-k*3.4,k*3.4-k*k*6,k*1.5);
    for(const key of keys){const q=J[key];const rx=q.x-c.x,ry=q.y-c.y;J[key]=V3(c.x+rx*ca-ry*sa+off.x,c.y+rx*sa+ry*ca+off.y,q.z+off.z)}J.tilt+=a}
  else if(dead==='slip'){const k=Math.min(1,dT*3.2),a=k*1.15,c=J.bF.clone(),ca=Math.cos(a),sa=Math.sin(a);
    for(const key of keys){if(key==='bF')continue;const q=J[key];const rx=q.x-c.x,ry=q.y-c.y;J[key]=V3(c.x+rx*ca-ry*sa,c.y+rx*sa+ry*ca,q.z)}J.tilt+=a;
    if(k>=1){const kk=Math.sin(dT*28)*0.12,k2=Math.cos(dT*31)*0.12;J.fF.add(V3(kk,0.3+k2,0));J.fK.add(V3(k2*0.5,0.18,0));J.bK.add(V3(-kk*0.4,0.2,0))}
    J.hands=J.shF.clone().add(V3(-0.35,0.15+Math.sin(dT*20)*0.06,0))}
  if(dead){J.armDir=J.hands.clone().sub(J.shF).normalize();J.arm=J.hands.distanceTo(J.shF)}
  return J;
}
function drawMannequin(J,lvl,over,t,dead){
  const heat=dead?0:lvl===3?1:lvl===2?0.35:0;
  MANNE.mat.color.setRGB(lerp(0.83,0.95,heat),lerp(0.85,0.36,heat),lerp(0.88,0.33,heat));
  MANNE.mat.emissive.setRGB(heat*0.25,0,0);
  const j=MANNE.j,l=MANNE.l;
  placeSph(j.hip,J.hip,0.13);placeSph(j.chest,J.chest,0.12);placeSph(j.neck,J.neck,0.08);
  placeSph(j.fK,J.fK,0.075);placeSph(j.bK,J.bK,0.07);placeSph(j.fF,J.fF,0.07);placeSph(j.bF,J.bF,0.065);
  placeSph(j.shF,J.shF,0.08);placeSph(j.shB,J.shB,0.075);placeSph(j.hands,J.hands,0.075);
  placeCyl(l.torso1,J.hip,J.chest,0.15);placeCyl(l.torso2,J.chest,J.neck,0.17);
  placeCyl(l.neckL,J.neck,J.neck.clone().lerp(J.head,0.5),0.06);
  placeCyl(l.fT,J.hip,J.fK,0.075);placeCyl(l.fS,J.fK,J.fF,0.065);placeCyl(l.bT,J.hip,J.bK,0.07);placeCyl(l.bS,J.bK,J.bF,0.06);
  // 腕：強すぎるとゴムのようにぐにゃぐにゃ
  const n=MANNE.armF.length;
  for(const [arr,sh,el,zo] of [[MANNE.armF,J.shF,j.elF,0.05],[MANNE.armB,J.shB,j.elB,-0.05]]){
    const end=J.hands.clone().add(V3(0,0,zo*0.4));
    const side=V3(-J.armDir.y,J.armDir.x,0);
    let prev=sh.clone();const wig=over>0.05?over*0.09:0;
    for(let i=1;i<=n;i++){const u=i/n;const q=sh.clone().lerp(end,u).addScaledVector(side,Math.sin(u*Math.PI*3+t*30+zo*40)*wig*Math.sin(u*Math.PI));
      placeCyl(arr[i-1],prev,q,0.055*(1-over*0.35));if(i===Math.round(n/2))placeSph(el,q,0.06);prev=q}
  }
  MANNE.head.position.copy(J.head);MANNE.head.scale.set(0.2,0.24,0.2);MANNE.head.rotation.z=J.tilt*0.6;
  const fy=0.01;MANNE.shadow.position.set((J.fF.x+J.bF.x)/2,fy,FEET_Z);const shs=dead==='snap'?Math.max(0.05,0.55-FX.deathT):0.55;MANNE.shadow.scale.set(shs,shs*0.35,1);
}

function buildParts(){

function spawnPart(pos,vel,r,color,life){const p=W3.parts.find(q=>q.life<=0);if(!p)return;p.m.position.copy(pos);p.v.copy(vel);p.m.scale.setScalar(r);p.m.material.color.set(color);p.life=life;p.m.visible=true}
function spawnSpark(pos,vel,s,life){const p=W3.sparks.find(q=>q.life<=0);if(!p)return;p.sp.position.copy(pos);p.v.copy(vel);p.sp.scale.set(s,s,1);p.life=life;p.max=life;p.sp.visible=true}

  if(!gg||!gg.dead){if(lvl>=2&&live&&Math.random()<dt*(lvl===3?14:4))spawnPart(J.head.clone().add(V3(0,0.15,0)),V3(-0.6-Math.random()*0.8,1.2+Math.random(),0.3),0.025+Math.random()*0.015,0x9fd8ff,0.7)}
  // 綱
  const ropeOn=gg&&(mode==='play'||mode==='dying'||gg.demo);
  W3.rope.visible=false;W3.rope2.visible=false;
  if(ropeOn&&(front||gg.phase==='pop')){
    const end=front||hole.clone().addScaledVector(dir,0.06);
    W3.ropeMat.color.setRGB(lerp(0.85,1,over),lerp(0.69,0.25,over),lerp(0.42,0.15,over));
    W3.ropeMat.emissive.setRGB(over*0.35,0,0);
    if(gg.dead==='snap'){const k=Math.min(1,FX.deathT*2.5);const mid=J.hands.clone().lerp(end,0.5);
      setRope(W3.rope,J.hands,J.hands.clone().lerp(mid,0.6).add(V3(-k*0.3,-k*0.8,0)),0.1,0);
      setRope(W3.rope2,end,end.clone().lerp(mid,0.6).add(V3(k*0.2,-k*0.9,0)),0.1,0)}
    else if(gg.dead==='slip'){const k=Math.min(1,FX.deathT*1.6);const st=J0.hands.clone().lerp(end,k*0.6);setRope(W3.rope,st,end,0.5+k*0.3,0)}
    else setRope(W3.rope,J.hands,end,0.05+under*0.6,over*0.04);

  // 山になった○△■と飛んでいるもの
  for(const f of FX.flying){f.t+=dt;const k=Math.min(1,f.t/f.d),e=1-Math.pow(1-k,2);
    f.m.position.lerpVectors(f.a,f.b,e);f.m.position.y+=Math.sin(k*Math.PI)*f.arc;
    f.m.rotation.x=f.r0+e*f.spin;f.m.rotation.z=f.r0*0.5+e*f.spin*0.7;
    const s=lerp(1,f.s1,e);f.m.scale.setScalar(s);setDirty(f.m,lerp(0.6,0,k));
    if(k>=1&&!f.done){f.done=true;f.m.rotation.set(0,Math.random()*3,0);if(f.m.userData.id==='cone')f.m.rotation.z=Math.random()<0.5?0:Math.PI/2;
      for(let i=0;i<6;i++)spawnSpark(f.m.position.clone().add(V3(0,0.2,0)),V3((Math.random()-0.5)*2,Math.random()*2,(Math.random()-0.5)*2),0.3,0.5)}}
  FX.flying=FX.flying.filter(f=>!f.done);
  updParts(dt);
  // カメラのゆれ
  // タイトル画面では場面を上に寄せて、下の枠に隠れないようにする
  FX.camOff=lerp(FX.camOff||0,mode==='title'?1:0,Math.min(1,dt*3));
  if(CAM.userData.base){CAM.position.copy(CAM.userData.base);const k=FX.camOff;CAM.position.z*=1+0.3*k;CAM.position.y+=0.2*k;CAM.lookAt(0.3,2.5-1.9*k,0);if(FX.shake>0){CAM.position.x+=(Math.random()-0.5)*FX.shake*0.012;CAM.position.y+=(Math.random()-0.5)*FX.shake*0.012;FX.shake=Math.max(0,FX.shake-dt*30)}}
  R3.render(SCN,CAM);
  if(AC&&mode==='play')creak(over*(gg.grace>0?0.3:1));
}

function handleEvents(){
  if(!g)return;
  while(g.ev.length){const e=g.ev.shift();
    if(e.k==='pop'){
      const it=e.it,big=it.size>=150;
      const hole=HOLE(),m=W3.cur;
      if(m){
        // 飛ばして床に積む
        m.material.clippingPlanes=[];
        const i=FX.pileN++,r=m.userData.r,s1=clamp(0.42/r,0.3,0.9);
        const tx=0.05+((i*0.37)%1)*1.75,tz=1.35+((i*0.61)%1)*0.9;
        FX.flying.push({m,a:m.position.clone(),b:V3(tx,r*s1*0.9,tz),arc:1.2+Math.random()*0.8,t:0,d:0.7,r0:m.rotation.x,spin:4+Math.random()*4,s1,done:false});
        W3.pile.push(m);if(W3.pile.length>14){const old=W3.pile.shift();SCN.remove(old)}
        W3.cur=null;FX.curKey=null;
      }
      const dir=V3(-1,-0.1,0.4).normalize();
      for(let i=0;i<(big?40:24);i++){const v=dir.clone().multiplyScalar(2+Math.random()*(big?5:3.5)).add(V3((Math.random()-0.5)*2.5,Math.random()*2.5,(Math.random()-0.5)*2));spawnPart(hole.clone(),v,0.04+Math.random()*0.06,Math.random()<0.6?0x6b4317:0x3f260a,1.2)}
      for(let i=0;i<18;i++)spawnSpark(hole.clone(),V3((Math.random()-0.5)*4,Math.random()*3,(Math.random()-0.5)*3),0.35+Math.random()*0.3,0.6+Math.random()*0.4);
      const s=screenOf(hole);
      FX.floats.push({txt:big?T().buriBig:T().buri,x:clamp(s.x-30,110,Wv-110),y:s.y+28,t:0,d:0.9,v:18,size:big?32:30,col:'#a8692a',stroke:'#fff3d6',rot:-0.12});
      // 連続（危なげなく抜けた回数）
      if(g.n>1&&FX.itemDanger<0.05)FX.streak++;else if(g.n>1)FX.streak=0;FX.itemDanger=0;
      FX.floats.push({txt:'+'+it.size+'cm',sub:(it.gold?T().gold+' ':'')+iname(it.id),x:clamp(s.x-50,90,Wv-90),y:s.y-60,t:0,d:1.2,v:40,size:big?40:32,col:big?'#ffe066':'#fff3d6'});
      setTimeout(()=>{if(!g)return;const s2=screenOf(V3(2.6,3.6,-0.4));FX.floats.push({txt:T().fuu,x:Math.min(Wv-50,s2.x),y:s2.y,t:0,d:1.2,v:16,size:20,col:'#e8f5d0',stroke:'#2d4a14',rot:0.08})},350);
      FX.shake=big?10:5;FX.flash=big?0.3:0.1;FX.wob=big?1.6:1;
      if(big||it.gold){FX.blush=1;FX.wave=1;FX.bigWob=true}
      SE.pop(it.size);if(big||it.gold)SE.big();
      vib(big?[40,40,90]:35);
    }else if(e.k==='next'){SE.next()}
    else if(e.k==='loose'){SE.rumble();FX.shake=6;FX.lurch=0.25;FX.wob=0.6}
    else if(e.k==='stuck'){SE.rumble();FX.shake=6;FX.clench=1;FX.lurch=-0.12}
    else if(e.k==='snap'||e.k==='slip'){
      FX.deathT=0;
      if(g.demo){if(e.k==='snap'){FX.shake=10;for(let i=0;i<20;i++)spawnPart(V3(0.2,1.9,0.6),V3((Math.random()-0.5)*4,Math.random()*3,(Math.random()-0.5)*2),0.02,0xe8c07a,0.8)}else FX.clench=1;continue}
      mode='dying';bgmStop();FX.slowSkip=false;
      vib(220);
      if(e.k==='snap'){SE.snap();FX.shake=16;FX.flash=0.45;for(let i=0;i<20;i++)spawnPart(V3(0.2,1.9,0.6),V3((Math.random()-0.5)*4,Math.random()*3,(Math.random()-0.5)*2),0.02,0xe8c07a,0.8)}
      else{SE.slip();FX.shake=10;FX.clench=1}
    }
  }
}

async function fbAuth(){

let RANK=null,RANK_TIME=0;

  c.fillStyle='rgba(0,0,0,.35)';c.fillRect(0,0,W,H);
  const h=G.hist||[];const N=Math.min(300,h.length/3|0);if(N<2)return;
  const st=h.length/3-N;const X=i=>8+(W-16)*i/(N-1),Y=v=>H-8-(H-16)*clamp(v/1.15,0,1);
  // ちょうどいい範囲（緑の帯）
  c.beginPath();for(let i=0;i<N;i++){const k=(st+i)*3;c.lineTo(X(i),Y(h[k+2]))}for(let i=N-1;i>=0;i--){const k=(st+i)*3;c.lineTo(X(i),Y(h[k+1]))}c.closePath();
  c.fillStyle='rgba(90,200,110,.45)';c.fill();c.strokeStyle='rgba(140,240,150,.8)';c.lineWidth=1.5;c.stroke();
  // 自分の力（白・強すぎ赤・弱すぎ青）
  c.lineWidth=4;c.lineCap='round';
  for(let i=1;i<N;i++){const k0=(st+i-1)*3,k=(st+i)*3,P=h[k];c.strokeStyle=P>h[k+2]?'#ff4a4a':P<h[k+1]?'#5aa8ff':'#ffffff';c.beginPath();c.moveTo(X(i-1),Y(h[k0]));c.lineTo(X(i),Y(P));c.stroke()}
  // 最後に×
  const kl=(st+N-1)*3,xl=X(N-1),yl=Y(h[kl]);c.strokeStyle='#ffe066';c.lineWidth=4;c.beginPath();c.moveTo(xl-9,yl-9);c.lineTo(xl+9,yl+9);c.moveTo(xl+9,yl-9);c.lineTo(xl-9,yl+9);c.stroke();
}
async function showRanking(){
  stopDemo();
  mode='title';bgmStop();ov.className='';const tx=T();
  ov.innerHTML=`<div class="box"><h2>${tx.rank}</h2><p>${tx.loading}</p></div>`;
  let list=null,err=false;try{list=await loadRanking(true)}catch(_){err=true}
  const me=(lsGet('furo_auth')||{}).uid;
  const rows=(list||[]).map((r,i)=>`<tr${r.u===me?' class="me"':''}><td>${i+1}</td><td class="nm">${escH(r.n)}<br><small class="rt">${escH(titleText(r.ti)||bodyOf(r.s))}</small>${r.x?`<br><a href="https://x.com/${escH(r.x)}" target="_blank" rel="noopener">@${escH(r.x)}</a>`:''}</td><td><b>${(+r.s).toLocaleString('en-US')}</b>cm</td><td><button class="s pv" data-u="${escH(r.u)}" data-n="${escH(r.n)}" aria-label="replay">▶</button></td></tr>`).join('');
  ov.innerHTML=`<div class="box"><h2>${tx.rkTitle}</h2>
   ${!NET_OK?`<p>${tx.rkWait}</p>`:err?`<p>${tx.rkFail}</p>`:list.length?`<div class="tbl"><table>${rows}</table></div><p class="note">${tx.rkNote}</p>`:`<p>${tx.rkEmpty}</p>`}
   <button class="main" id="bk">${tx.back}</button></div>`;
  ov.querySelectorAll('.pv').forEach(b=>b.onclick=()=>playReplay(b.dataset.u,b.dataset.n));
  document.getElementById('bk').onclick=()=>{g=null;resetFX();showTitle()};
}
async function playReplay(u,name){
  const tx=T();ov.className='';ov.innerHTML=`<div class="box"><p>${tx.rpLoad}</p></div>`;
  try{const r=await fbGet(DBP+'/replays/'+u);if(!r||!r.r)throw new Error('none');
    initAudio();resetFX();g=newGame(r.seed);g.replay={ev:decRec(r.r),i:0};mode='play';ov.className='hide';bgmStart();
    document.getElementById('rpbar').hidden=false;document.getElementById('rpname').textContent=tx.rpNow+(name||'');document.getElementById('rpstop').textContent=tx.rpStop;
  }catch(e){ov.innerHTML=`<div class="box"><h2>${tx.rpFail}</h2><button class="main" id="tt2">${tx.back}</button></div>`;document.getElementById('tt2').onclick=showRanking}
}
document.getElementById('rpstop').onclick=()=>{document.getElementById('rpbar').hidden=true;if(g&&g.replay&&g.replay.own){while(!g.dead)simStep(g);g.ev=[];finish();return}g=null;resetFX();showRanking()};
document.getElementById('mute').onclick=()=>{initAudio();setMute(!muted)};

// ============================================================
//  ループ
// ============================================================
let last=performance.now(),acc=0;const STEP=1/FPS;
function loop(ts){
  const dt=Math.min(0.1,Math.max(0,(ts-last)/1000));last=ts;const t=ts/1000;
  if(stage.clientWidth!==cw||stage.clientHeight!==chh)resize();
  let dv=dt;   // 見た目の時間（失敗の瞬間はスロー）
  if(g&&(mode==='play'||mode==='dying')){
    acc+=dt;let n=0;while(acc>=STEP&&n<8){simStep(g);acc-=STEP;n++}if(n>=8)acc=0;
    handleEvents();
    if(mode==='dying'){
      const slow=!FX.slowSkip&&FX.deathT<0.3;   // 最初の約1.2秒は4分の1の速さ
      dv=slow?dt*0.25:dt;FX.deathT+=dv;
      if(FX.deathT>1.5)finish()}
    // 重い端末は自動で軽量モードに（はじめの4秒の平均で判断）
    if(!LITE&&FX.fpsT<4){FX.fpsT+=dt;FX.fpsN++;if(FX.fpsT>=4&&FX.fpsN/FX.fpsT<38)setLite()}
  }
  // タイトル画面の自動デモ（開いて3秒後から）
  if(g&&g.demo&&mode==='title'){
    if(!g.dead){acc+=dt;let n=0;while(acc>=STEP&&n<8){demoBot();simStep(g);acc-=STEP;n++}if(n>=8)acc=0}
    DEMO_MUTE=true;handleEvents();DEMO_MUTE=false;
    if(g.dead){FX.deathT+=dt;if(FX.deathT>2.2)startDemo()}
  }
  render3D(dv,t);drawOverlay(dv,t);
  requestAnimationFrame(loop);
}
if(!SIM_ONLY){
  if(typeof THREE==='undefined')GL_OK=false;else build3D();
  setMute(muted);resize();showTitle();requestAnimationFrame(loop);
  const rp=new URLSearchParams(location.search).get('replay');
  if(rp&&NET_OK&&GL_OK)playReplay(rp,'');
}
