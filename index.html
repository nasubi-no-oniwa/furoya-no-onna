// ============================================================
//  シミュレーション（1秒60回、乱数はシード固定 → 再生が同じになる）
// ============================================================
const FPS=60;
const P_UP=0.62/FPS, P_DOWN=0.82/FPS, P_MAX=1.15;
function pickItem(g){
  const n=g.n,r=g.rng;
  let tot=0;const w=ITEMS.map(it=>{
    let x=1;
    if(it.id==='denchu')x=n>=15?0.35:0;
    else if(it.cm>=150)x=Math.min(1,(n+2)/9);
    else if(it.cm<=45)x=n<6?1.3:0.8;
    if(g.item&&g.item.id===it.id)x*=0.15;
    tot+=x;return x});
  let v=r()*tot;for(let i=0;i<ITEMS.length;i++){v-=w[i];if(v<=0)return ITEMS[i]}
  return ITEMS[0];
}
function makeItem(g){
  const def=pickItem(g),r=g.rng,n=g.n;
  const size=Math.round(def.cm*(0.85+r()*0.3));
  const base=def.cat==='h'?0.74+r()*0.17:def.cat==='m'?0.48+r()*0.15:0.22+r()*0.13;
  let W=Math.max(0.04,0.155-n*0.0045);if(def.cat==='f')W*=0.88;
  const need=Math.min(6.2,0.95+size/95)*FPS;
  const it={id:def.id,def,size,T:base,T0:base,W,need,prog:0,snag:null,dm:0.7+Math.min(0.55,n*0.025),
    drift:n>=12?Math.min(0.13,(n-12)*0.0065):0,dper:Math.round((2+r()*1.4)*FPS),dph:Math.floor(r()*240)};
  if(n>=4&&r()<Math.min(0.55,0.12+n*0.022)){
    const at=need*(0.3+r()*0.4);
    let kind=def.cat==='h'?'loose':def.cat==='f'?'stuck':(r()<0.5?'stuck':'loose');
    const T2=kind==='loose'?Math.max(0.18,base-0.28-r()*0.12):Math.min(0.97,base+0.24+r()*0.1);
    it.snag={at,kind,T2,done:false};
  }
  return it;
}
function newGame(seed){
  const g={seed,rng:mulberry32(seed),f:0,hold:false,P:0,score:0,n:0,stress:0,slip:0,
    phase:'pull',grace:Math.round(1.7*FPS),popF:0,dead:null,deadF:0,item:null,big:null,
    rec:[],replay:null,ev:[] /* 描画用イベント */};
  g.item=makeItem(g);
  return g;
}
function setHold(g,h){if(g.dead||g.replay)return;if(g.hold===h)return;g.hold=h;g.rec.push([g.f,h?1:0])}
function simStep(g){
  if(g.replay){const ev=g.replay.ev;while(g.replay.i<ev.length&&ev[g.replay.i][0]<=g.f){g.hold=ev[g.replay.i][1]===1;g.replay.i++}}
  g.f++;
  if(g.dead){g.deadF++;return}
  g.P=clamp(g.P+(g.hold?P_UP:-P_DOWN),0,P_MAX);
  if(g.phase==='pop'){
    g.popF--;g.stress=Math.max(0,g.stress-1.6/FPS);g.slip=Math.max(0,g.slip-1.6/FPS);
    if(g.popF<=0){g.item=makeItem(g);g.phase='pull';g.grace=Math.round(0.95*FPS);g.ev.push({k:'next'})}
    return;
  }
  const it=g.item;
  // 途中で固さが変わる
  if(it.snag&&!it.snag.done&&it.prog>=it.snag.at){it.snag.done=true;it.T0=it.snag.T2;g.grace=Math.max(g.grace,Math.round(0.5*FPS));g.ev.push({k:it.snag.kind})}
  // 先のほうは、ちょうどいい強さがゆらゆら動く（三角波・端末差の出ない計算）
  if(it.drift>0){const ph=((g.f+it.dph)%it.dper)/it.dper;const tri=ph<0.5?ph*4-1:3-ph*4;it.T=clamp(it.T0+it.drift*tri,0.15,1.05)}else it.T=it.T0;
  const lo=it.T-it.W,hi=it.T+it.W,P=g.P;
  if(P>=lo&&P<=hi){
    it.prog+=1-0.45*Math.abs(P-it.T)/it.W;
    g.stress=Math.max(0,g.stress-1.5/FPS);g.slip=Math.max(0,g.slip-1.5/FPS);
  }else if(g.grace>0){
    g.stress=Math.max(0,g.stress-0.8/FPS);g.slip=Math.max(0,g.slip-0.8/FPS);
  }else if(P>hi){
    g.stress+=it.dm*(0.95+(P-hi)*8)/FPS;g.slip=Math.max(0,g.slip-1.2/FPS);
  }else{
    g.slip+=it.dm*(0.85+(lo-P)*6)/FPS;g.stress=Math.max(0,g.stress-1.2/FPS);
  }
  if(g.grace>0)g.grace--;
  if(g.stress>=1){g.dead='snap';g.endF=g.f;g.ev.push({k:'snap'});return}
  if(g.slip>=1){g.dead='slip';g.endF=g.f;g.ev.push({k:'slip'});return}
  if(it.prog>=it.need){
    g.score+=it.size;g.n++;
    if(!g.big||it.size>g.big.size)g.big={id:it.id,size:it.size};
    g.phase='pop';g.popF=Math.round(0.6*FPS);g.ev.push({k:'pop',it});
  }
}
function encRec(rec){let out=[],pf=0;for(const [f,k] of rec){out.push((f-pf).toString(36)+k);pf=f}return out.join('.')}
function decRec(s){const ev=[];let f=0;if(!s)return ev;for(const t of s.split('.')){f+=parseInt(t.slice(0,-1)||'0',36);ev.push([f,+t.slice(-1)])}return ev}

let AC=null,MASTER=null,BGM_G=null,SE_G=null,muted=!!lsGet('furo_mute');
function initAudio(){
  if(AC){if(AC.state==='suspended')AC.resume();return}
  try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(_){return}
  MASTER=AC.createGain();MASTER.gain.value=muted?0:0.9;MASTER.connect(AC.destination);
  BGM_G=AC.createGain();BGM_G.gain.value=0.32;BGM_G.connect(MASTER);
  SE_G=AC.createGain();SE_G.gain.value=0.8;SE_G.connect(MASTER);
}
function setMute(m){muted=m;lsSet('furo_mute',m);if(MASTER)MASTER.gain.setTargetAtTime(m?0:0.9,AC.currentTime,0.05);document.getElementById('mute').textContent=m?'🔇':'🔊'}
function tone(freq,dur,type,vol,dest,slide,at){if(!AC)return;const t=at||AC.currentTime;const o=AC.createOscillator(),g=AC.createGain();o.type=type||'sine';o.frequency.setValueAtTime(freq,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(20,slide),t+dur);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol||0.3,t+0.008);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);o.connect(g);g.connect(dest||SE_G);o.start(t);o.stop(t+dur+0.02)}
let NOISE=null;
function noiseBuf(){if(NOISE)return NOISE;const b=AC.createBuffer(1,AC.sampleRate*1.2,AC.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;return NOISE=b}
function noise(dur,f1,f2,vol,q,at){if(!AC)return;const t=at||AC.currentTime;const s=AC.createBufferSource();s.buffer=noiseBuf();const bp=AC.createBiquadFilter();bp.type='bandpass';bp.Q.value=q||1;bp.frequency.setValueAtTime(f1,t);if(f2)bp.frequency.exponentialRampToValueAtTime(f2,t+dur);
  const g=AC.createGain();g.gain.setValueAtTime(vol||0.4,t);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);s.connect(bp);bp.connect(g);g.connect(SE_G);s.start(t);s.stop(t+dur+0.05)}

let creakNode=null;
function creak(level){ // 綱のきしみ（強すぎのとき）
  if(!AC)return;
  if(!creakNode){const s=AC.createBufferSource();s.buffer=noiseBuf();s.loop=true;const bp=AC.createBiquadFilter();bp.type='bandpass';bp.frequency.value=420;bp.Q.value=6;const g=AC.createGain();g.gain.value=0;s.connect(bp);bp.connect(g);g.connect(SE_G);s.start();creakNode={g,bp}}
  creakNode.g.gain.setTargetAtTime(level*0.5,AC.currentTime,0.05);creakNode.bp.frequency.setTargetAtTime(380+level*500,AC.currentTime,0.05);
}
// BGM：陽気な和風（ヨナ抜き音階＋太鼓）
let bgmOn=false,bgmNext=0,bgmStep=0,bgmTimer=null;
const PENTA=[0,2,4,7,9];
const MEL=[0,2,4,2, 3,4,2,0, 1,2,4,3, 2,-1,0,-1, 4,5,7,5, 4,2,3,4, 2,1,0,1, 2,-1,0,-1];
function midi(n){return 440*Math.pow(2,(n-69)/12)}
function degNote(d,base){const o=Math.floor(d/5),i=((d%5)+5)%5;return base+o*12+PENTA[i]}
function bgmTick(){
  if(!bgmOn||!AC)return;
  const spb=60/132/2;
  while(bgmNext<AC.currentTime+0.25){
    const t=bgmNext,s=bgmStep%32,m=MEL[s];
    if(m>=0){const n=degNote(m,72);tone(midi(n),0.28,'triangle',0.16,BGM_G,null,t);tone(midi(n)*2,0.12,'sine',0.04,BGM_G,null,t)}
    if(s%2===0){const b=degNote([0,0,3,4][(s>>3)%4],48);tone(midi(b),0.22,'sine',0.2,BGM_G,null,t)}
    if(s%8===0||s%8===5){tone(95,0.22,'sine',0.5,BGM_G,48,t)}
    if(s%4===2){const sN=AC.createBufferSource();sN.buffer=noiseBuf();const hp=AC.createBiquadFilter();hp.type='highpass';hp.frequency.value=5000;const g=AC.createGain();g.gain.setValueAtTime(0.06,t);g.gain.exponentialRampToValueAtTime(0.0001,t+0.05);sN.connect(hp);hp.connect(g);g.connect(BGM_G);sN.start(t);sN.stop(t+0.06)}
    bgmNext+=spb;bgmStep++;
  }
}
function bgmStart(){if(!AC||bgmOn)return;bgmOn=true;bgmNext=AC.currentTime+0.05;bgmStep=0;BGM_G.gain.setTargetAtTime(0.32,AC.currentTime,0.1);clearInterval(bgmTimer);bgmTimer=setInterval(bgmTick,90)}
function bgmStop(){bgmOn=false;clearInterval(bgmTimer);if(creakNode)creak(0)}

function itemLen(size){return clamp(38+size*0.58,52,230)}
function drawShapes(c,def,len){
  const k=len/100;
  c.save();c.scale(k,k);c.translate(0,-def.h/2);
  c.lineCap='round';c.lineJoin='round';
  for(const s of def.s){
    const t=s[0];
    if(t==='r'){const [_,x,y,w,h,col,rad]=s;c.fillStyle=col;rr(c,x,y,w,h,rad||0);c.fill();c.lineWidth=2.2/k;c.strokeStyle='rgba(30,12,6,.85)';c.stroke()}
    else if(t==='c'){const [_,x,y,r,col]=s;c.fillStyle=col;c.beginPath();c.arc(x,y,r,0,Math.PI*2);c.fill();c.lineWidth=1.8/k;c.strokeStyle='rgba(30,12,6,.75)';c.stroke()}
    else if(t==='e'){const [_,x,y,rx,ry,col]=s;c.fillStyle=col;c.beginPath();c.ellipse(x,y,rx,ry,0,0,Math.PI*2);c.fill()}
    else if(t==='o'){const [_,x,y,r,lw,col]=s;if(r<=0)continue;c.beginPath();c.arc(x,y,r,0,Math.PI*2);c.lineWidth=lw+3/k;c.strokeStyle='rgba(30,12,6,.85)';c.stroke();c.lineWidth=lw;c.strokeStyle=col;c.stroke()}
    else if(t==='l'){const [_,x1,y1,x2,y2,lw,col]=s;c.beginPath();c.moveTo(x1,y1);c.lineTo(x2,y2);if(lw>2){c.lineWidth=lw+3/k;c.strokeStyle='rgba(30,12,6,.85)';c.stroke()}c.lineWidth=lw;c.strokeStyle=col;c.stroke()}
    else if(t==='p'){const [_,pts,col]=s;c.beginPath();c.moveTo(pts[0],pts[1]);for(let i=2;i<pts.length;i+=2)c.lineTo(pts[i],pts[i+1]);c.closePath();c.fillStyle=col;c.fill();c.lineWidth=2.2/k;c.strokeStyle='rgba(30,12,6,.85)';c.stroke()}
  }
  c.restore();
}
function rr(c,x,y,w,h,r){r=Math.min(r,w/2,h/2);c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}

}

  const over=it&&gg.phase==='pull'&&!gg.dead?clamp((P-hi)/0.12,0,1):0;
  const under=it&&gg.phase==='pull'&&!gg.dead?clamp((lo-P)/0.15,0,1):0;

  if(gg&&gg.dead){if(!FX.deathHands)FX.deathHands={x:hands.x,y:hands.y};hands=FX.deathHands}

  // 客

  if(gi){ctx.save();ctx.shadowColor='rgba(0,0,0,.35)';ctx.shadowBlur=18;ctx.drawImage(gi,gx-gw/2,gb-gh,gw,gh);ctx.restore()}

  // 湯面（客の下の方を湯にしずめる）
  {const wy=gb-gh*0.06;const gr=ctx.createLinearGradient(0,wy-6,0,wy+30);gr.addColorStop(0,'rgba(150,190,120,0)');gr.addColorStop(0.35,'rgba(150,190,120,.55)');gr.addColorStop(1,'rgba(120,160,95,.0)');
    ctx.fillStyle=gr;ctx.beginPath();ctx.ellipse(gx,wy+8,gw*0.62,20,0,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle='rgba(255,240,200,.35)';ctx.lineWidth=1.5;for(let i=0;i<3;i++){const rr2=(t*0.6+i/3)%1;ctx.globalAlpha=1-rr2;ctx.beginPath();ctx.ellipse(gx,wy+6,gw*0.4+rr2*60,8+rr2*8,0,0,Math.PI*2);ctx.stroke()}ctx.globalAlpha=1}
  // 引き出し中のガラクタ（客の体の穴から出てくる。穴より奥は描かない）
  let front=null,dir=null;
  {const dx=hands.x-anchor.x,dy=hands.y-anchor.y,d=Math.hypot(dx,dy);dir={x:dx/d,y:dy/d,d}}
  let itemVis=null;
  const holeA=Math.atan2(dir.y,dir.x);
  // 穴（引くたびにむにゅっと広がる）
  const holding=gg&&gg.hold&&mode==='play';
  FX.sq=lerp(FX.sq||1,(holding?1.18:1)+(gg&&gg.phase==='pop'?0.5:0),Math.min(1,dt*10));

   ctx.fillStyle=g2;ctx.beginPath();ctx.ellipse(h.x,h.y,r*0.92,r,-J.tilt*0.6,0,Math.PI*2);ctx.fill();ctx.strokeStyle='rgba(25,20,25,.9)';ctx.lineWidth=2;ctx.stroke();
   ctx.fillStyle='rgba(255,255,255,.55)';ctx.beginPath();ctx.ellipse(h.x-r*0.38,h.y-r*0.45,r*0.22,r*0.13,-0.6,0,Math.PI*2);ctx.fill()}
  // 青すじ（強すぎ）

  // 弱すぎ：？
  if(!dead&&under>0.3){ctx.fillStyle='#fff';ctx.strokeStyle='#111';ctx.lineWidth=3;ctx.font='22px "Dela Gothic One", sans-serif';ctx.strokeText('?',h.x+r*0.6,h.y-r*0.8);ctx.fillText('?',h.x+r*0.6,h.y-r*0.8)}
  // 湯気（全力のとき頭から）

function hexA(h,a){const n=parseInt(h.slice(1),16);return`rgba(${n>>16&255},${n>>8&255},${n&255},${a})`}
function star(c,r){c.beginPath();for(let i=0;i<8;i++){const rr2=i%2?r*0.35:r;const a=i*Math.PI/4;c.lineTo(Math.cos(a)*rr2,Math.sin(a)*rr2)}c.closePath();c.fill()}

function drawOnnaAndCall(Ly,dt,t){

  }
  let face=FX.callKind==='strong'||FX.callKind==='stuck'?'strong':FX.callKind==='gentle'||FX.callKind==='slip'||FX.callKind==='snap'?'gentle':'normal';

    ctx.save();ctx.globalAlpha=Math.max(0,k);ctx.translate(bx,by);ctx.scale(pop,pop);
    ctx.font=`26px "Dela Gothic One", sans-serif`;const tw=Math.min(240,ctx.measureText(FX.callTxt).width);const bw=tw+34,bh=50;

function handleEvents(){
  if(!g)return;const Ly=L();
  while(g.ev.length){const e=g.ev.shift();
    if(e.k==='pop'){
      const it=e.it,len=itemLen(it.size);
      const hands=FX.hands||Ly.hands,anchor=Ly.anchor,dx=hands.x-anchor.x,dy=hands.y-anchor.y,d=Math.hypot(dx,dy);
      const fx=anchor.x+dx/d*(6+len),fy=anchor.y+dy/d*(6+len);
      const cx=anchor.x+dx/d*(6+len/2),cy=anchor.y+dy/d*(6+len/2);
      const sp=FX.pile.length;
      FX.flying.push({id:it.id,len,x0:cx,y0:cy,x1:Ly.pile.x+((sp*37)%90-45),y1:Ly.pile.y-(sp%5)*7,r0:Math.atan2(-dy,-dx)+Math.PI,r1:(Math.random()-0.5)*1.4,s1:clamp(46/len,0.28,0.7),arc:90+Math.random()*60,t:0,d:0.62,done:false});
      for(let i=0;i<26;i++){const a=Math.random()*Math.PI*2,v=60+Math.random()*180;FX.parts.push({x:anchor.x,y:anchor.y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-60,life:0.5+Math.random()*0.5,r:5+Math.random()*7,star:true,g:120})}
      const big=it.size>=150;
      // 茶色いしぶき
      for(let i=0;i<(big?40:24);i++){const a=Math.atan2(dy,dx)+(Math.random()-0.5)*2.2,v=90+Math.random()*(big?320:220);FX.parts.push({x:anchor.x,y:anchor.y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-80,life:0.7+Math.random()*0.5,r:3+Math.random()*5,col:Math.random()<0.6?'#6b4317':'#3f260a',g:520,drip:true})}
      // 「ぶりっ！」
      FX.floats.push({txt:big?'ぶりゅりゅりゅっ！':'ぶりっ！',x:clamp(anchor.x+30,110,W-110),y:anchor.y+24,t:0,d:0.9,v:18,size:big?34:30,col:'#a8692a',stroke:'#fff3d6',rot:-0.12});
      // 客がすっきり「ふぅ…」
      setTimeout(()=>{if(!g)return;const Ly2=L();FX.floats.push({txt:'ふぅ…',x:Ly2.gx+Ly2.gw*0.12,y:Ly2.gBottom-Ly2.gh*0.95,t:0,d:1.2,v:16,size:20,col:'#e8f5d0',stroke:'#2d4a14',rot:0.08});
        for(let i=0;i<5;i++)FX.stink.push({x:Ly2.gx-Ly2.gw*0.05+i*6,y:Ly2.gBottom-Ly2.gh*0.62,r:10,vx:20+i*6,a:1.2})},350);
      FX.floats.push({txt:'+'+it.size+'cm',sub:iname(it.def),x:clamp(anchor.x-20,90,W-90),y:anchor.y-60,t:0,d:1.2,v:40,size:big?40:32,col:big?'#ffe066':'#fff3d6'});
      FX.shake=big?10:5;FX.flash=big?0.35:0.12;FX.guestWob=1;
      SE.pop(it.size);if(big)SE.big();
      const oks=T().ok;say('ok',oks[(FX.okIx++)%oks.length],0.9);
    }else if(e.k==='next'){SE.next()}
    else if(e.k==='loose'){say('loose',T().loose,1.1);SE.rumble();FX.shake=8;FX.floats.push({txt:T().rumble,x:Ly.anchor.x,y:Ly.anchor.y-40,t:0,d:0.8,v:30,size:22,col:'#cfe3ff',stroke:'#1d2c4a'})}
    else if(e.k==='stuck'){say('stuck',T().stuck,1.1);SE.rumble();FX.shake=8;FX.floats.push({txt:T().rumble,x:Ly.anchor.x,y:Ly.anchor.y-40,t:0,d:0.8,v:30,size:22,col:'#ffd0d0',stroke:'#4a0d14'})}
    else if(e.k==='snap'||e.k==='slip'){
      mode='dying';FX.deathT=0;bgmStop();
      if(e.k==='snap'){SE.snap();FX.shake=16;FX.flash=0.5;
        const hands=FX.hands||Ly.hands,an=Ly.anchor;FX.ropeBreak={mx:(hands.x+an.x)/2+20,my:(hands.y+an.y)/2,fx:an.x,fy:an.y};
        for(let i=0;i<30;i++){FX.parts.push({x:FX.ropeBreak.mx,y:FX.ropeBreak.my,vx:(Math.random()-0.5)*300,vy:(Math.random()-0.8)*260,life:0.7,col:'#e8c07a',r:2,g:400})}}
      else{SE.slip();FX.shake=10}
      say(e.k,T()[e.k],3);
      FX.floats.push({txt:T()[e.k],x:W/2,y:VH*0.45,t:0,d:1.6,v:10,size:40,col:'#fff3d6'});
    }
  }
}

async function fbAuth(){
  let a=lsGet('furo_auth');if(a&&a.exp>Date.now()+60000)return a;
  if(a&&a.refresh){try{const r=await fetch('https://securetoken.googleapis.com/v1/token?key='+FB.apiKey,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:'grant_type=refresh_token&refresh_token='+encodeURIComponent(a.refresh)});
    if(r.ok){const j=await r.json();a={uid:j.user_id,token:j.id_token,refresh:j.refresh_token,exp:Date.now()+(+j.expires_in)*1000};lsSet('furo_auth',a);return a}}catch(_){}}
  const r=await fetch('https://identitytoolkit.googleapis.com/v1/accounts:signUp?key='+FB.apiKey,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({returnSecureToken:true})});
  if(!r.ok)throw new Error('auth');const j=await r.json();a={uid:j.localId,token:j.idToken,refresh:j.refreshToken,exp:Date.now()+(+j.expiresIn)*1000};lsSet('furo_auth',a);return a;
}
async function fbGet(path,q){const r=await fetch(DBU()+path+'.json'+(q||''));if(!r.ok)throw new Error('get '+r.status);return r.json()}
async function fbPut(path,val,a){const r=await fetch(DBU()+path+'.json?auth='+encodeURIComponent(a.token),{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(val)});if(!r.ok)throw new Error('put '+r.status);return r.json()}
let RANK=null,RANK_TIME=0;
async function loadRanking(force){
  if(!NET_OK)return null;
  if(RANK&&!force&&Date.now()-RANK_TIME<60000)return RANK;
  const [sc,hd]=await Promise.all([fbGet('/furo/scores','?orderBy=%22s%22&limitToLast=60'),fbGet('/furo/hidden')]);
  RANK=Object.entries(sc||{}).filter(([u])=>!(hd&&hd[u])).map(([u,v])=>Object.assign({u},v)).sort((a,b)=>b.s-a.s||a.t-b.t).slice(0,30);RANK_TIME=Date.now();return RANK;
}
function canEnter(s){if(!NET_OK||s<=0||g.replay)return false;const sent=lsGet('furo_sent');if(sent!=null&&s<=sent)return false;if(!RANK)return true;return RANK.length<30||s>RANK[RANK.length-1].s}
async function submitScore(name,xid){
  const a=await fbAuth();
  await fbPut('/furo/replays/'+a.uid,{seed:g.seed,r:encRec(g.rec),v:VER},a);
  await fbPut('/furo/scores/'+a.uid,{n:name,x:xid,s:g.score,c:g.n,f:g.endF||g.f,t:{'.sv':'timestamp'},seed:g.seed,v:VER},a);
  lsSet('furo_sent',g.score);lsSet('furo_name',name);lsSet('furo_x',xid);await loadRanking(true);
}

}
async function playReplay(u,name){
  const tx=T();ov.className='';ov.innerHTML=`<div class="box"><p>${tx.rpLoad}</p></div>`;
  try{const r=await fbGet('/furo/replays/'+u);if(!r||!r.r)throw new Error('none');
    initAudio();resetFX();g=newGame(r.seed);g.replay={ev:decRec(r.r),i:0};mode='play';ov.className='hide';bgmStart();say('ok',tx.go,1.1);
    document.getElementById('rpbar').hidden=false;document.getElementById('rpname').textContent=tx.rpNow+(name||'');document.getElementById('rpstop').textContent=tx.rpStop;
  }catch(e){ov.innerHTML=`<div class="box"><h2>${tx.rpFail}</h2><button class="main" id="tt2">${tx.back}</button></div>`;document.getElementById('tt2').onclick=showRanking}
}
document.getElementById('rpstop').onclick=()=>{document.getElementById('rpbar').hidden=true;g=null;showRanking()};
document.getElementById('mute').onclick=()=>{initAudio();setMute(!muted)};

// ============================================================
//  ループ
// ============================================================
let last=performance.now(),acc=0;const STEP=1/FPS;
function loop(ts){
  const dt=Math.min(0.1,Math.max(0,(ts-last)/1000));last=ts;
  const t=ts/1000;
  if(stage.clientWidth!==cw||stage.clientHeight!==chh)resize();
  if(g&&(mode==='play'||mode==='dying')){
    acc+=dt;let n=0;
    while(acc>=STEP&&n<8){simStep(g);acc-=STEP;n++}
    if(n>=8)acc=0;
    handleEvents();
    if(mode==='dying'){FX.deathT+=dt;if(FX.deathT>1.5)finish()}
  }
  ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,cv.width,cv.height);
  drawGame(dt,t);
  requestAnimationFrame(loop);
}
// 管理画面の検算用：操作の記録だけで最後まで動かして点を出す
window.verifyReplay=function(seed,r){const G=newGame(seed);G.replay={ev:decRec(r),i:0};
  while(!G.dead&&G.f<216000)simStep(G);return{score:G.score,n:G.n,f:G.endF||G.f,dead:G.dead}};
const SIM_ONLY=new URLSearchParams(location.search).get('sim')==='1';
setMute(muted);
if(!SIM_ONLY){resize();showTitle();requestAnimationFrame(loop)}
loading.then(()=>{
  if(SIM_ONLY)return;
  const rp=new URLSearchParams(location.search).get('replay');
  if(rp&&NET_OK)playReplay(rp,'');else if(mode==='title')showTitle();
});
</script>
