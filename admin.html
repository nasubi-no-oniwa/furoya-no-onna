<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>風呂屋の女 管理画面</title>
<meta name="robots" content="noindex">
<style>
body{margin:0;background:#2a1210;color:#fff3d6;font-family:"Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",Meiryo,sans-serif}
main{max-width:680px;margin:0 auto;padding:16px}
h1{font-size:22px;color:#ffc65a}
.box{background:#3b1714;border:2px solid #d9a24f;border-radius:12px;padding:12px;margin:12px 0}
code{background:#000;padding:4px 8px;border-radius:6px;font-size:13px;word-break:break-all;-webkit-user-select:all;user-select:all}
table{width:100%;border-collapse:collapse;font-size:14px}
td{padding:6px;border-bottom:1px solid rgba(255,255,255,.1);vertical-align:middle}
tr.hid{opacity:.45}
tr.bad td{background:rgba(220,40,40,.18)}
button{border:none;border-radius:8px;padding:6px 10px;font-weight:bold;font-family:inherit;cursor:pointer}
.hide{background:#d0342c;color:#fff}.show{background:#5a4a33;color:#fff}.chk{background:#3f6fb5;color:#fff}
a{color:#8fc6ff}
.msg{color:#ffb3a8}
small{color:#d9bfa0}
</style>
<script src="config.js"></script>
</head>
<body><main>
<h1>風呂屋の女 管理画面</h1>
<div class="box">
  <div>この画面の管理用ID：</div><p><code id="uid">読みこみ中…</code></p>
  <div style="font-size:13px;line-height:1.7">はじめての時だけ：Firebase の Realtime Database で、いちばん上に <b>furo_admin</b> を作り、その下に <b>uid</b> を作って、値に上のIDを入れてください。<br>（このブラウザのデータを消すとIDが変わります。そのときは入れなおしてください）</div>
</div>
<div class="box">
  <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap"><b>記録（上位100）</b>
    <span><button class="chk" id="checkAll">全部を検算</button> <button class="show" id="reload">読みなおす</button></span></div>
  <p style="font-size:13px;line-height:1.6;margin:8px 0">「検算」は、残っている操作の記録をもう一度動かして、同じ点になるかを確かめます。ちがう点になったものは赤くなります（ずるの疑い）。</p>
  <p class="msg" id="msg"></p>
  <table id="tbl"></table>
</div>
</main>
<!-- 検算のためにゲームを見えない枠で読みこむ -->
<iframe id="sim" src="index.html?sim=1" style="display:none" title="検算"></iframe>
<script>
const FB=window.FURO_FB||{},DBU=String(FB.databaseURL||'').replace(/\/$/,'');
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function lsGet(k){try{return JSON.parse(localStorage.getItem(k))}catch(_){return null}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(_){}}
async function auth(){let a=lsGet('furo_admin_auth');if(a&&a.exp>Date.now()+60000)return a;
  if(a&&a.refresh){const r=await fetch('https://securetoken.googleapis.com/v1/token?key='+FB.apiKey,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:'grant_type=refresh_token&refresh_token='+encodeURIComponent(a.refresh)});
    if(r.ok){const j=await r.json();a={uid:j.user_id,token:j.id_token,refresh:j.refresh_token,exp:Date.now()+(+j.expires_in)*1000};lsSet('furo_admin_auth',a);return a}}
  const r=await fetch('https://identitytoolkit.googleapis.com/v1/accounts:signUp?key='+FB.apiKey,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({returnSecureToken:true})});
  if(!r.ok)throw new Error('ログインできませんでした（Firebase で匿名ログインが有効か確認）');const j=await r.json();a={uid:j.localId,token:j.idToken,refresh:j.refreshToken,exp:Date.now()+(+j.expiresIn)*1000};lsSet('furo_admin_auth',a);return a}
let LIST=[];
async function load(){const msg=document.getElementById('msg');msg.textContent='';
  try{
    if(!FB.apiKey||!FB.databaseURL)throw new Error('config.js に apiKey と databaseURL が入っていません');
    const a=await auth();document.getElementById('uid').textContent=a.uid;
    const [sc,hd]=await Promise.all([fetch(DBU+'/furo3/scores.json?orderBy=%22s%22&limitToLast=100').then(r=>r.json()),fetch(DBU+'/furo3/hidden.json').then(r=>r.json())]);
    LIST=Object.entries(sc||{}).map(([u,v])=>Object.assign({u},v)).sort((x,y)=>y.s-x.s||x.t-y.t);
    document.getElementById('tbl').innerHTML=LIST.map((r,i)=>{const h=hd&&hd[r.u];return `<tr id="r_${esc(r.u)}" class="${h?'hid':''}"><td>${i+1}</td><td>${esc(r.n)}${r.x?`<br><a href="https://x.com/${esc(r.x)}" target="_blank" rel="noopener">@${esc(r.x)}</a>`:''}<br><small>${new Date(r.t).toLocaleString('ja-JP')}</small></td><td><b>${(+r.s).toLocaleString()}</b>cm<br><small>${r.c}個・${Math.round((r.f||0)/60)}秒</small></td><td class="ck"><button class="chk" data-c="${esc(r.u)}">検算</button></td><td><a href="./?replay=${encodeURIComponent(r.u)}" target="_blank">再生</a></td><td>${h?`<button class="show" data-u="${esc(r.u)}" data-h="0">戻す</button>`:`<button class="hide" data-u="${esc(r.u)}" data-h="1">隠す</button>`}</td></tr>`}).join('')||'<tr><td>まだ記録がありません</td></tr>';
    document.querySelectorAll('[data-u]').forEach(b=>b.onclick=async()=>{try{const a=await auth();const u=b.dataset.u;
      const r=await fetch(DBU+'/furo3/hidden/'+u+'.json?auth='+encodeURIComponent(a.token),{method:b.dataset.h==='1'?'PUT':'DELETE',body:b.dataset.h==='1'?'true':undefined});
      if(!r.ok)throw new Error('変更できませんでした（furo_admin/uid にこの画面のIDが入っているか確認）');load()}catch(e){msg.textContent=e.message}});
    document.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>check(b.dataset.c));
  }catch(e){msg.textContent=e.message}}
async function check(u){
  const row=document.getElementById('r_'+u);if(!row)return;const cell=row.querySelector('.ck');cell.textContent='検算中…';
  try{
    const rec=LIST.find(x=>x.u===u);
    const rp=await fetch(DBU+'/furo3/replays/'+u+'.json').then(r=>r.json());
    if(!rp||!rp.r)throw new Error('操作の記録がない');
    const w=document.getElementById('sim').contentWindow;
    if(!w||!w.verifyReplay)throw new Error('検算の準備ができていない。少し待ってもう一度');
    const res=w.verifyReplay(rp.seed,rp.r);
    const ok=res.score===rec.s&&res.n===rec.c&&rp.seed===rec.seed;
    cell.innerHTML=ok?'<b style="color:#8fe08f">OK</b>':`<b style="color:#ff8a80">ちがう</b><br><small>再計算 ${res.score}cm・${res.n}個</small>`;
    row.classList.toggle('bad',!ok);
  }catch(e){cell.innerHTML=`<small>${esc(e.message)}</small>`}
}
document.getElementById('reload').onclick=load;
document.getElementById('checkAll').onclick=async()=>{for(const r of LIST){await check(r.u)}};
load();
</script>
</body>
</html>
